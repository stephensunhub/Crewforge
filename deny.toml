# cargo-deny 配置：检查依赖的许可证、已知漏洞和来源。
# 运行：cargo deny check            （只查许可证：cargo deny check licenses）
# 新增依赖带了不在白名单里的许可证时会失败；确认没问题后再把它加进 allow。

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",  # 文件级弱 copyleft：只作为依赖使用，不修改其源码
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
version = 2
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
